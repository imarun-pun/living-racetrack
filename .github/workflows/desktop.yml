# Builds the Lapwall desktop app for Windows, macOS and Linux.
# Run it from the Actions tab (Run workflow), or push a version tag like v0.3.0.
# Windows gives an installer and a portable .exe (runs straight from a USB stick), macOS a .dmg and a .zip, Linux an AppImage.
name: Build desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: Lapwall-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*-mac.zip
            desktop/release/*.AppImage
