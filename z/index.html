<html lang="en">
<head>

<title>A drive-by for you</title>
<meta name="description" content="Someone sent you a drive-by with a special message. Tap to watch it arrive.">
<meta name="theme-color" content="#07090d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pit Wall">
<meta property="og:title" content="Zoooom! A race car is coming for you">

<meta property="og:image" content="https://imarun-pun.github.io/living-racetrack/icons/og-driveby.png">
<meta property="og:image:width" content="1200">

<body>
<main class="stage" id="stage">
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="msgcard dim" id="card" aria-live="polite">
    <div class="eyebrow" id="eyebrow">Pit board incoming</div>
    <h1 id="title">A drive-by for you</h1>
    <p id="msg"></p>
    <div class="from" id="from"></div>
    <div class="actions">
      <button type="button" id="replay">Replay</button>
      <a class="btn primary" id="reply" href="../send.html">Send one back</a>
    </div>
  </div>
  <canvas class="road" id="road" hidden aria-hidden="true"></canvas>
  <div class="ground"></div>
  <div class="brand">Pit Wall · Living Racetrack</div>
</main>
<script src="../js/data.js"></script>
<script src="../js/flags.js"></script>
<script src="../js/garage.js"></script>
<script src="../js/driveby.js"></script>
<script src="../js/share.js"></script>
<script src="../js/go.js"></script>
</body>
</html>
