<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Zoom-by for you</title>
<meta name="description" content="Someone sent you a Zoom-by with a special message. Tap to watch it arrive.">
<meta name="theme-color" content="#07090d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lapwall">
<meta property="og:title" content="Zoooom! A race car is coming for you">
<meta property="og:description" content="Someone sent you a Zoom-by with a special message. Tap to watch it arrive.">
<meta property="og:image" content="https://imarun-pun.github.io/living-racetrack/icons/og-driveby.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/share.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="bokeh" id="bokeh" aria-hidden="true"></div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <section class="glass start" id="start">
    <div class="eyebrow" id="sEyebrow">Incoming Zoom-by</div>
    <div class="slights" id="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <button type="button" class="go" id="go">Start the engine</button>
    <p class="small" id="sNote">Sound on · or wait and it rolls out on its own</p>
  </section>

  <section class="glass msgcard" id="card" aria-live="polite" hidden>
    <div class="eyebrow" id="eyebrow">Pit board</div>
    <h1 id="title">A Zoom-by for you</h1>
    <p class="msg" id="msg"></p>
    <div class="from" id="from"></div>
    <div class="react" id="react" role="group" aria-label="Send a reaction">
      <button type="button" data-e="❤️" aria-label="Love">❤️</button>
      <button type="button" data-e="🔥" aria-label="Fire">🔥</button>
      <button type="button" data-e="🏁" aria-label="Chequered flag">🏁</button>
      <button type="button" data-e="🎉" aria-label="Party">🎉</button>
      <button type="button" data-e="😂" aria-label="Laugh">😂</button>
    </div>
    <div class="actions">
      <button type="button" class="pill" id="launch">Launch</button>
      <a class="pill primary" id="reply" href="../send.html">Send one back</a>
    </div>
  </section>

  <p class="hint" id="hint" hidden>Tap the car to rev it</p>
  <canvas class="road" id="road" hidden aria-label="A race car"></canvas>
  <div class="ground"></div>
  <button type="button" class="pill snd" id="snd" aria-pressed="false">Sound off</button>
  <div class="brand">Lapwall</div>
</main>
<script src="../js/data.js"></script>
<script src="../js/flags.js"></script>
<script src="../js/carside.js"></script>
<script src="../js/driveby.js"></script>
<script src="../js/share.js"></script>
<script src="../js/go.js"></script>
</body>
</html>
